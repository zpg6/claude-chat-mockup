<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pricing section preview</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 20px;
                background: #f4f1ea;
                color: #282722;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            .plans {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }
            article {
                min-width: 0;
                background: #fff;
                padding: 18px 14px;
                border: 1px solid #dfdbd3;
                border-radius: 10px;
            }
            article.pro {
                border-color: #c56b4d;
                box-shadow: 0 8px 20px #c56b4d18;
            }
            h2 {
                font-size: 13px;
                margin: 0 0 16px;
                font-weight: 500;
            }
            .price {
                font-size: clamp(22px, 5vw, 32px);
                letter-spacing: -0.04em;
                margin: 0 0 16px;
            }
            .price span {
                font-size: 10px;
                letter-spacing: 0;
                color: #77756e;
            }
            p {
                font-size: 11px;
                color: #77756e;
                line-height: 1.6;
                margin: 0 0 18px;
            }
            button {
                width: 100%;
                border: 1px solid #dfdbd3;
                border-radius: 6px;
                background: #f7f6f2;
                padding: 8px 4px;
                color: inherit;
                font:
                    500 11px -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                cursor: pointer;
            }
            .pro button {
                background: #c56b4d;
                color: #fff;
                border-color: #c56b4d;
            }
            button:focus-visible {
                outline: 2px solid #c56b4d;
                outline-offset: 3px;
            }
            @media (max-width: 420px) {
                body {
                    padding: 12px;
                }
                .plans {
                    gap: 6px;
                }
                article {
                    padding: 12px 8px;
                }
                h2 {
                    font-size: 12px;
                    margin-bottom: 10px;
                }
                .price {
                    margin-bottom: 10px;
                }
                .price span {
                    display: block;
                }
                p {
                    font-size: 10px;
                    line-height: 1.4;
                    margin-bottom: 12px;
                }
                button {
                    font-size: 10px;
                }
            }
        </style>
    </head>
    <body>
        <section class="plans" aria-label="Pricing plans">
            <article>
                <h2>Starter</h2>
                <div class="price">$0<span> / mo</span></div>
                <p>For your first project.<br />Up to 3 collaborators.</p>
                <button type="button">Start free</button>
            </article>
            <article class="pro">
                <h2>Pro</h2>
                <div class="price">$24<span> / mo</span></div>
                <p>For a growing team.<br />Unlimited projects.</p>
                <button type="button">Choose Pro</button>
            </article>
            <article>
                <h2>Team</h2>
                <div class="price">$49<span> / mo</span></div>
                <p>For the whole company.<br />Shared workspaces.</p>
                <button type="button">Choose Team</button>
            </article>
        </section>
    </body>
</html>
