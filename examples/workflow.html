<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Thinking, actions and outputs · claude-chat-mockup</title>
        <link rel="stylesheet" href="../dist/style.css" />
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 40px 20px 56px;
                background: #eeece6;
                color: #282722;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            main {
                max-width: 760px;
                margin: 0 auto;
            }
            header {
                max-width: 570px;
                margin: 0 0 24px;
            }
            .back {
                display: inline-block;
                color: #77756e;
                font-size: 12px;
                margin-bottom: 18px;
                text-underline-offset: 3px;
            }
            h1 {
                font-size: clamp(26px, 5vw, 38px);
                line-height: 1.15;
                letter-spacing: -0.04em;
                font-weight: 500;
                margin: 0 0 12px;
            }
            p {
                font-size: 14px;
                line-height: 1.6;
                color: #77756e;
                margin: 0;
            }
            .options {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                margin: 24px 0 12px;
            }
            .options button {
                text-align: left;
                border: 1px solid #d3d0c8;
                border-radius: 9px;
                padding: 11px 12px;
                background: transparent;
                color: #77756e;
                font: inherit;
                cursor: pointer;
            }
            .options button[aria-pressed="true"] {
                background: #f7f6f2;
                border-color: #c56b4d;
                color: #282722;
                box-shadow: 0 2px 7px #28272208;
            }
            .options b {
                display: block;
                font-size: 12px;
                font-weight: 500;
            }
            .options span {
                display: block;
                margin-top: 3px;
                font-size: 10px;
                line-height: 1.4;
            }
            .settings {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 12px 24px;
                margin: 18px 0 14px;
                font-size: 12px;
            }
            label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            select {
                font: inherit;
                padding: 4px;
                background: transparent;
                color: inherit;
                border: 1px solid #d3d0c8;
                border-radius: 5px;
            }
            input {
                accent-color: #b85a3a;
            }
            .note {
                margin-top: 14px;
                font-size: 11px;
            }
            .note a {
                color: inherit;
                text-underline-offset: 2px;
            }
            #hero {
                min-width: 0;
            }
            .artifact-view {
                --dock-bg: #fcfbf7;
                --dock-line: #ddd6c8;
                --dock-ink: #625b4f;
                --dock-active: #b85a3a;
                height: 100%;
                min-width: 0;
                display: grid;
                grid-template-rows: minmax(0, 1fr) auto;
                background: #f4f1ea;
                color: #282722;
                position: relative;
            }
            .artifact-panels {
                grid-row: 1;
                grid-column: 1;
                position: relative;
                min-height: 0;
                min-width: 0;
            }
            .artifact-panel {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }
            .artifact-panel[hidden],
            .artifact-panel img[hidden],
            .preview-fallback[hidden] {
                display: none;
            }
            .artifact-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                min-height: 31px;
                padding: 9px 12px 2px;
                font-size: 10px;
                color: #77756e;
            }
            .artifact-heading strong {
                font-weight: 400;
            }
            .artifact-heading a {
                color: inherit;
                font-size: 9px;
                text-decoration: none;
            }
            .artifact-heading a:hover {
                text-decoration: underline;
            }
            .board-preview {
                display: block;
                flex: 1;
                min-height: 0;
                padding: 6px 16px 14px;
            }
            .board-preview img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            .datasheet-preview {
                display: flex;
                align-items: center;
                justify-content: center;
                flex: 1;
                min-height: 0;
                padding: 8px 16px 14px;
                color: inherit;
                text-decoration: none;
            }
            .datasheet-preview img {
                width: 100%;
                height: 100%;
                display: block;
                object-fit: contain;
            }
            .preview-fallback {
                max-width: 180px;
                text-align: center;
                font-size: 11px;
                line-height: 1.6;
                color: #77756e;
            }
            .file-panel {
                justify-content: center;
                align-items: flex-start;
                padding: 24px;
                gap: 10px;
            }
            .file-panel h2 {
                font-size: 15px;
                line-height: 1.3;
                font-weight: 500;
                margin: 0;
                letter-spacing: -0.02em;
            }
            .file-panel p {
                font-size: 11px;
                max-width: 280px;
            }
            .file-links {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
                margin-top: 5px;
            }
            .file-links a {
                border: 1px solid #d3d0c8;
                border-radius: 6px;
                padding: 8px 10px;
                color: #625b4f;
                background: #fcfbf7;
                text-decoration: none;
                font-size: 10px;
            }
            .file-links a:hover {
                border-color: #b85a3a;
                color: #a24c30;
            }
            .file-types {
                font-size: 9px;
                color: #8e887c;
                line-height: 1.5;
            }
            .output-dock {
                grid-row: 2;
                grid-column: 1;
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 2px;
                padding: 4px 8px;
                border-top: 1px solid var(--dock-line);
                background: var(--dock-bg);
            }
            .output-tab {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 0;
                min-height: 44px;
                padding: 6px 4px;
                border: 1px solid transparent;
                border-radius: 6px;
                color: var(--dock-ink);
                background: transparent;
                cursor: pointer;
                font:
                    400 10px/1.3 -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }
            .output-tab svg {
                width: 18px;
                height: 18px;
                object-fit: contain;
                flex: none;
                fill: none;
                stroke: currentColor;
            }
            .output-tab[aria-selected="true"] {
                color: var(--dock-active);
                background: #efe9de;
            }
            .output-tab:hover {
                background: #eeeadf;
            }
            [data-variant="floating"] .artifact-view {
                display: block;
            }
            [data-variant="floating"] .artifact-panels {
                height: 100%;
                padding-bottom: 72px;
            }
            [data-variant="floating"] .artifact-panel {
                bottom: 72px;
            }
            [data-variant="floating"] .output-dock {
                position: absolute;
                z-index: 1;
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
                width: min(310px, calc(100% - 22px));
                padding: 5px;
                gap: 3px;
                border: 1px solid var(--dock-line);
                border-radius: 12px;
                box-shadow: 0 6px 20px #625b4f17;
            }
            [data-variant="floating"] .output-tab {
                flex-direction: column;
                gap: 4px;
                min-height: 47px;
                padding: 5px 3px;
                font-size: 9px;
                border-radius: 8px;
            }
            [data-variant="side"] .artifact-view {
                grid-template-columns: minmax(0, 1fr) 68px;
                grid-template-rows: minmax(0, 1fr);
            }
            [data-variant="side"] .output-dock {
                grid-row: 1;
                grid-column: 2;
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 51px);
                align-content: center;
                gap: 5px;
                padding: 8px 6px;
                border-top: 0;
                border-left: 1px solid var(--dock-line);
            }
            [data-variant="side"] .output-tab {
                flex-direction: column;
                gap: 4px;
                padding: 5px 1px;
                font-size: 9px;
            }
            button:focus-visible,
            a:focus-visible,
            select:focus-visible,
            input:focus-visible {
                outline: 2px solid #b85a3a;
                outline-offset: 3px;
            }
            @media (max-width: 420px) {
                body {
                    padding: 24px 12px 40px;
                }
                .options {
                    gap: 5px;
                }
                .options button {
                    padding: 9px 7px;
                }
                .options b {
                    font-size: 11px;
                }
                .options span {
                    font-size: 9px;
                }
                .claude-step {
                    font-size: 11px;
                    gap: 8px;
                }
                .output-dock {
                    padding: 4px;
                }
                .output-tab {
                    flex-direction: column;
                    gap: 4px;
                    font-size: 9px;
                    padding: 5px 2px;
                }
                .file-panel {
                    padding: 18px;
                }
                .file-panel h2 {
                    font-size: 14px;
                }
                .file-panel p {
                    font-size: 10px;
                }
                [data-variant="side"] .artifact-view {
                    grid-template-columns: minmax(0, 1fr) 62px;
                }
                [data-variant="side"] .output-dock {
                    padding: 6px 4px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <a class="back" href="./conversation.html">← Compare with Conversation</a>
                <h1>The outputs, inside the conversation.</h1>
                <p>One numbered action list, with three ways to reach the board and its files.</p>
            </header>
            <div class="options" role="group" aria-label="Output dock options">
                <button type="button" data-option="bottom" aria-pressed="true">
                    <b>Bottom dock</b><span>Quiet icons and labels</span>
                </button>
                <button type="button" data-option="floating" aria-pressed="false">
                    <b>Floating tray</b><span>Centered over the canvas</span>
                </button>
                <button type="button" data-option="side" aria-pressed="false">
                    <b>Side dock</b><span>A compact vertical strip</span>
                </button>
            </div>
            <div class="settings">
                <label
                    >Theme
                    <select id="theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="auto">System</option>
                    </select></label
                >
                <label><input id="hold" type="checkbox" /> Hold result readiness</label>
            </div>
            <div id="hero" data-variant="bottom"></div>
            <p id="load-error" class="note" role="alert" hidden></p>
            <p class="note">
                Illustrative playback using a saved Molex CAN Node design. Sequence compressed; Replay reuses existing
                outputs. <a href="./workflow-assets/provenance.json">Output sources</a>.
            </p>
        </main>
        <script type="module">
            import { ClaudeWindow } from "../dist/index.mjs";

            const outputRoot = "https://copperlayer.ai/mcpui/";
            const pdf =
                outputRoot +
                "molex_can_node_hero-f70397ceee1875978c86746e104e83fb0b3cfc168363bdf16b2b87719e7206de.datasheet.pdf";
            const fab =
                outputRoot +
                "molex_can_node_hero-8fbbd32ca6f59e3c7c11152d202e8203787ad328e72640c0815bc2a19d39691b.fab.zip";
            const base = outputRoot + "after-gerbers/housing/base-print.stl";
            const lid = outputRoot + "after-gerbers/housing/lid-print.stl";
            // Existing Copperlayer MCP export-file glyphs; see asset provenance.
            const glyphs = {
                board: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="8" y="8" width="6" height="6" rx="1"/><path d="M11 3v5m3 3h7M8 11H3m8 3v7m6-17v3h4M3 17h4v4"/></svg>',
                housing:
                    '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v8"/></svg>',
                datasheet:
                    '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Zm0 0v6h6M8 13h8m-8 4h5"/></svg>',
                fabrication:
                    '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/></svg>',
            };
            const result = document.createElement("div");
            result.className = "artifact-view";
            result.innerHTML = `<div class="output-dock" role="tablist" aria-label="Design outputs" aria-orientation="horizontal">
                ${["board", "housing", "datasheet", "fabrication"].map((name, index) => `<button type="button" class="output-tab" id="output-${name}" role="tab" data-view="${name}" aria-controls="view-${name}" aria-selected="${index === 0}" tabindex="${index === 0 ? 0 : -1}">${glyphs[name]}<span>${name[0].toUpperCase() + name.slice(1)}</span></button>`).join("")}
            </div>
            <div class="artifact-panels">
                <section class="artifact-panel" id="view-board" role="tabpanel" aria-labelledby="output-board">
                    <div class="artifact-heading"><strong>Board render</strong><a href="./workflow-assets/board.png" target="_blank" rel="noopener">Open image ↗</a></div>
                    <a class="board-preview" href="./workflow-assets/board.png" target="_blank" rel="noopener" aria-label="Open the full board render"><img alt="Molex CAN Node board render showing its connectors, CAN interface, GPIO and SWD header"></a>
                </section>
                <section class="artifact-panel file-panel" id="view-housing" role="tabpanel" aria-labelledby="output-housing" hidden>
                    <h2>Housing files</h2><p>Open the base or lid in a 3D viewer.</p>
                    <div class="file-links"><a href="${base}" target="_blank" rel="noopener">Base · STL ↗</a><a href="${lid}" target="_blank" rel="noopener">Lid · STL ↗</a></div>
                </section>
                <section class="artifact-panel" id="view-datasheet" role="tabpanel" aria-labelledby="output-datasheet" hidden>
                    <div class="artifact-heading"><strong>Datasheet</strong><a href="${pdf}" target="_blank" rel="noopener">Open PDF ↗</a></div>
                    <a class="datasheet-preview" href="${pdf}" target="_blank" rel="noopener"><img alt="Molex CAN Node datasheet, first page"><span class="preview-fallback" hidden>Preview unavailable. Open the datasheet PDF.</span></a>
                </section>
                <section class="artifact-panel file-panel" id="view-fabrication" role="tabpanel" aria-labelledby="output-fabrication" hidden>
                    <h2>Fabrication files</h2><p>Gerbers, drill files, the KiCad board and design documents.</p>
                    <div class="file-links"><a href="${fab}" target="_blank" rel="noopener">Download ZIP ↗</a></div><span class="file-types">20 files · 3 MB archive</span>
                </section>
            </div>`;
            const board = result.querySelector(".board-preview img");
            const datasheet = result.querySelector(".datasheet-preview img");
            const dock = result.querySelector(".output-dock");
            const tabs = Array.from(dock.querySelectorAll("[data-view]"));
            const selectView = name => {
                tabs.forEach(tab => {
                    const selected = tab.dataset.view === name;
                    tab.setAttribute("aria-selected", String(selected));
                    tab.tabIndex = selected ? 0 : -1;
                });
                result
                    .querySelectorAll(".artifact-panel")
                    .forEach(panel => (panel.hidden = panel.id !== `view-${name}`));
            };
            tabs.forEach((tab, index) => {
                tab.addEventListener("click", () => selectView(tab.dataset.view));
                tab.addEventListener("keydown", event => {
                    const vertical = dock.getAttribute("aria-orientation") === "vertical";
                    let next = index;
                    if (event.key === (vertical ? "ArrowDown" : "ArrowRight")) next = (index + 1) % tabs.length;
                    else if (event.key === (vertical ? "ArrowUp" : "ArrowLeft"))
                        next = (index + tabs.length - 1) % tabs.length;
                    else if (event.key === "Home") next = 0;
                    else if (event.key === "End") next = tabs.length - 1;
                    else return;
                    event.preventDefault();
                    selectView(tabs[next].dataset.view);
                    tabs[next].focus();
                });
            });
            const hold = document.querySelector("#hold");
            const hero = document.querySelector("#hero");
            let boardLoaded = false;
            let datasheetSettled = false;
            const updateReady = () => chat.setReady(boardLoaded && datasheetSettled && !hold.checked);
            const chat = ClaudeWindow({
                prompt: "Design a 12 V CAN node with four GPIOs and SWD.",
                thinking: "Mapping the CAN and power connections.",
                steps: [
                    { label: "Resolve CAN and power parts" },
                    { label: "Place and route the board" },
                    { label: "Prepare the datasheet and fabrication files" },
                ],
                response: "Here are the board and design files.",
                tool: {
                    name: "copperlayer.ai",
                    call: "board_render",
                    title: "Molex CAN Node",
                    logo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5H9L5 9v6l4 4h10M19 9h-8l-2 2v2l2 2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                },
                stage: { content: result, height: 320 },
                theme: "light",
                animation: { responseDelay: 250 },
            }).mount(hero);
            board.addEventListener(
                "load",
                () => {
                    boardLoaded = true;
                    updateReady();
                },
                { once: true }
            );
            board.addEventListener(
                "error",
                () => {
                    boardLoaded = false;
                    updateReady();
                    const error = document.querySelector("#load-error");
                    error.hidden = false;
                    error.innerHTML = `The board preview could not load. You can still open the <a href="${pdf}" target="_blank" rel="noopener">datasheet</a> or <a href="${fab}" target="_blank" rel="noopener">fabrication files</a>.`;
                },
                { once: true }
            );
            datasheet.addEventListener(
                "load",
                () => {
                    datasheetSettled = true;
                    updateReady();
                },
                { once: true }
            );
            datasheet.addEventListener(
                "error",
                () => {
                    datasheetSettled = true;
                    datasheet.hidden = true;
                    result.querySelector(".preview-fallback").hidden = false;
                    updateReady();
                },
                { once: true }
            );
            board.src = "./workflow-assets/board.png";
            datasheet.src = "./workflow-assets/datasheet-page-1.png";
            document.querySelectorAll("[data-option]").forEach(button =>
                button.addEventListener("click", () => {
                    const name = button.dataset.option;
                    hero.dataset.variant = name;
                    document
                        .querySelectorAll("[data-option]")
                        .forEach(option => option.setAttribute("aria-pressed", String(option === button)));
                    dock.setAttribute("aria-orientation", name === "side" ? "vertical" : "horizontal");
                })
            );
            hold.addEventListener("change", updateReady);
            document.querySelector("#theme").addEventListener("change", event => chat.setTheme(event.target.value));
            window.addEventListener("pagehide", () => chat.destroy(), { once: true });
        </script>
    </body>
</html>
